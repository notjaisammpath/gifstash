name: GifStash

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  GifStash:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_NAME: GifStash
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/GifStash.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    sources:
      - path: Sources/App
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Sources/Shared
      - path: Resources/Assets.xcassets
    dependencies:
      - target: GifStashMessages

  GifStashMessages:
    type: app-extension.messages
    platform: iOS
    settings:
      base:
        PRODUCT_NAME: GifStashMessages
        PRODUCT_BUNDLE_IDENTIFIER: $(EXTENSION_BUNDLE_ID)
        INFOPLIST_FILE: Sources/MessagesExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MessagesExtension/GifStashMessages.entitlements
    sources:
      - path: Sources/MessagesExtension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Sources/Shared

schemes:
  GifStash:
    build:
      targets:
        GifStash: all
    run:
      config: Debug
    archive:
      config: Release
